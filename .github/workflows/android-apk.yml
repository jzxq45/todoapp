name: Android APK

on:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "android/**"
      - "cmd/**"
      - "internal/**"
      - "mobile/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build APK
        run: make apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: todoapp-apk
          path: dist/TodoApp.apk
          if-no-files-found: error
          retention-days: 7
